name: Update and deploy encrypted dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh GitHub data before deployment
        type: boolean
        default: true
  schedule:
    - cron: "30 2 * * *"
    - cron: "0 11 * * *"
permissions:
  contents: write
concurrency:
  group: encrypted-dashboard
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Restore, refresh and encrypt
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          REFRESH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh) }}
        shell: bash
        run: |
          if [ "$REFRESH" = "true" ]; then
            node dashboard-refresh.mjs
          else
            node dashboard-refresh.mjs --deploy-only
          fi
          node --test dashboard-crypto.test.mjs dashboard-loader.test.mjs
      - name: Commit encrypted snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js protected.js unlock.js dashboard-gate.css styles.css favicon.png .nojekyll site-public
          if ! git diff --cached --quiet; then
            git commit -m "chore: update encrypted dashboard [skip ci]"
            git push origin HEAD:main
          fi
      - name: Publish allowlisted files
        run: |
          git worktree add "$RUNNER_TEMP/dashboard-pages" origin/gh-pages
          cd "$RUNNER_TEMP/dashboard-pages"
          git rm -r --ignore-unmatch .
          for file in index.html app.js protected.js unlock.js dashboard-gate.css styles.css favicon.png .nojekyll; do
            cp "$GITHUB_WORKSPACE/site-public/$file" "$file"
          done
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Deploy encrypted dashboard"
            git push origin HEAD:gh-pages
          fi
      - name: Remove temporary decrypted sources
        if: always()
        run: node -e "require('node:fs').rmSync('.private', {recursive:true,force:true})"
